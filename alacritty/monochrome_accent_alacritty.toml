# ~/.config/alacritty/alacritty.toml

[window]
padding = { x = 12, y = 12 }
opacity = 0.94
blur = true

[font]
size = 11.0
normal = { family = "JetbrainsMono Nerd Font", style = "Regular" }

[colors.primary]
background = "#141415"
foreground = "#e4e4e7"

[colors.normal]
black   = "#27272a"
red     = "#f43f5e"
green   = "#10b981"
yellow  = "#f59e0b"
blue    = "#06b6d4"
magenta = "#ec4899"
cyan    = "#14b8a6"
white   = "#d4d4d8"

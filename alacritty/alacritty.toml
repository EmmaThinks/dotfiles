# ~/.config/alacritty/alacritty.toml

[window]
padding = { x = 12, y = 12 }
opacity = 0.94
blur = true

[font]
size = 11.0
normal = { family = "JetbrainsMono Nerd Font", style = "Regular" }

[colors.cursor]
text   = "#272e33"
cursor = "#d3c6aa"

[colors.selection]
text       = "#d3c6aa"
background = "#414b50"

[colors.primary]
background = "#272e33"
foreground = "#d3c6aa"

[colors.normal]
black   = "#414b50"
red     = "#e67e80"
green   = "#a7c080"
yellow  = "#dbbc7f"
blue    = "#7fbbb3"
magenta = "#d699b6"
cyan    = "#83c092"
white   = "#d3c6aa"

[colors.bright]
black   = "#475258"
red     = "#e67e80"
green   = "#a7c080"
yellow  = "#dbbc7f"
blue    = "#7fbbb3"
magenta = "#d699b6"
cyan    = "#83c092"
white   = "#d3c6aa"
